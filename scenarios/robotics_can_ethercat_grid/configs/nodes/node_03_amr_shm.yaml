node:
  identifier: "Edge-AMR-ShmRing-03"
  site_identifier: "Edge-AMR-ShmRing-03"
  hardware: { type: "DEVICE_DMI_FALLBACK", primary_backend: "ROCKCHIP_RKNN", xdp_driver_mode: "SKB" }
nexus: { enabled: true, host: "10.240.70.10", port: 50051, nexus_http_port: 9443, active_model_name: "lidar_spatial_detector.onnx", local_models_dir: "/etc/sentinel/models" }
routes:
  - sensor_id: AMR-ShmRing-LiDAR-03
    sensor_type: SHM_RING_MOTION
    driver_mode: SHM_RING
    match:
      port: 1
      transport: shm_ring
      package_id: org.aryorithm.package.amr_cbf_guard
      plugin_id: motion_guard_dissector_plugin.so
      owner_subsystem: 18_cps_sec
      execution_mode: CASCADE_SHORT_CIRCUIT
      model_id: lidar_spatial_detector.onnx
      silicon_target: ROCKCHIP_RKNN
      format: ONNX
      precision: INT8
      latency_budget_ns: 15000
      threshold_drop: 0.85
